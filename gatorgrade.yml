# Seven checks: three call your functions, one runs your program, two read it as Python, and one
# reads its text. The function checks call highest, count_at_or_above and average directly, with
# readings of their own, so each function has to take its readings as a parameter and return its
# answer. The program check runs main and reads only the report lines, so it forgives extra
# spaces, letter case, and a missing colon.

- description: "[RUN] The program prints the same report as before: one Highest, Reached watch and Average per gauge, then Peak"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_gauges.py::test_program_prints_the_same_report

- description: "[FUNCTION] highest(readings) returns the largest reading and prints nothing: start at readings\\[0\\], and end with return"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_gauges.py::test_highest_returns_the_largest

- description: "[FUNCTION] count_at_or_above(readings, level) returns how many readings are >= level, and 0 when none are"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_gauges.py::test_count_at_or_above_returns_the_count

- description: "[FUNCTION] average(readings) returns a whole number: divide the total by len(readings) with //"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_gauges.py::test_average_returns_a_whole_number

- description: "[CODE] main has no loops left: each loop lives in one of the three functions"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_main_has_no_loops

- description: "[CODE] main calls highest, count_at_or_above and average once for each gauge"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_main_calls_each_function_for_every_gauge

- src/main.py:
  - description: "[CODE] No TODO markers remain: delete each TODO comment once its code is written, including Author"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
